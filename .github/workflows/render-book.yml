name: render-book

on:
  push:
    branches:
      - devel
      - RELEASE_**
  workflow_dispatch:

jobs:
  render-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          bioc-version: devel

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R packages
        run: |
          Rscript -e "
            options(repos = c(CRAN = 'https://cloud.r-project.org'))
            if (!requireNamespace('BiocManager', quietly=TRUE))
              install.packages('BiocManager')
            BiocManager::install(version='devel', ask=FALSE, update=FALSE)
            BiocManager::install(c(
              'BiocFileCache', 'DT', 'SummarizedExperiment', 'gwascat',
              'BiocStyle', 'glue', 'sessioninfo', 'knitr', 'remotes',
              'rtracklayer', 'S4Vectors', 'ggmanh', 'ggplot2', 'ggbeeswarm',
              'GenomicRanges', 'BEDMatrix', 'bedbaser'
            ), ask=FALSE, update=FALSE)
            remotes::install_github('vjcitn/ontoProc2', upgrade='never')
            remotes::install_github('vjcitn/tQTLExperiment', upgrade='never')
          "

      - name: Install package
        run: R CMD INSTALL .

      - name: Render book
        run: quarto render inst/

      - name: Get target folder name
        run: |
          echo target_folder=$(echo ${{ github.ref_name }} | sed 's,RELEASE_,,' | tr '_' '.') >> "${GITHUB_ENV}"

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: inst/docs/
          target-folder: docs/${{ env.target_folder }}/
          branch: gh-pages
          clean: false
